# Builds all desktop targets through the shared target-package workflow and
# publishes one complete staged evidence set as a rolling prerelease.

name: Nightly Desktop

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-release-mutations
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"

jobs:
  setup:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
      - id: check
        name: Compare HEAD to last nightly tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          last_tag=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,isDraft,isPrerelease --jq '[.[] | select(.isDraft == false and .isPrerelease == true and (.tagName | test("^v.*-nightly\\.")))][0].tagName // ""')
          if [ -z "$last_tag" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_sha=$(git rev-parse "${last_tag}^{commit}")
          if [ "$last_sha" = "$(git rev-parse HEAD)" ]; then
            assets=$(gh release view "$last_tag" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
            if grep -Fxq "nightly.yml" <<< "$assets" && grep -Fxq "nightly-linux.yml" <<< "$assets" && grep -Fxq "nightly-mac.yml" <<< "$assets" && grep -Fxq "terminal-release-manifest.json" <<< "$assets"; then
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            else
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compute nightly version and tag
        if: steps.check.outputs.should_build == 'true'
        id: tag
        shell: bash
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          version=$(bun -e "$(cat <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { pathToFileURL } = require('url');
          (async () => {
            const mod = await import(pathToFileURL(path.resolve('apps/desktop/scripts/compute-nightly-version.mjs')).href);
            const manifest = JSON.parse(fs.readFileSync('.release-please-manifest.json', 'utf8'));
            process.stdout.write(mod.computeNightlyVersion({ manifest, runNumber: Number(process.env.GITHUB_RUN_NUMBER || '0'), date: new Date() }));
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          )")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Generate bot token
        if: steps.check.outputs.should_build == 'true'
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Create per-build nightly release
        if: steps.check.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then exit 0; fi
          gh release create "$TAG" --draft --prerelease --title "Mcode Nightly ${{ steps.tag.outputs.version }}" --notes "Automated nightly build from ${{ github.sha }}." --target "${{ github.sha }}" --repo "${{ github.repository }}"

  package:
    needs: setup
    if: needs.setup.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target-id: windows-x64
            runner: blacksmith-2vcpu-windows-2025
            platform: windows
            arch: x64
            build-args: --config.publish.channel=nightly
          - target-id: linux-x64
            runner: blacksmith-2vcpu-ubuntu-2404
            platform: linux
            arch: x64
            build-args: --config.publish.channel=nightly
          - target-id: macos-arm64
            runner: blacksmith-6vcpu-macos-26
            platform: macos
            arch: arm64
            build-args: --mac --arm64 --config.publish.channel=nightly
          - target-id: macos-x64
            runner: blacksmith-6vcpu-macos-26
            platform: macos
            arch: x64
            build-args: --mac --x64 --config.publish.channel=nightly
    uses: ./.github/workflows/desktop-package-target.yml
    with:
      runner: ${{ matrix.runner }}
      target-platform: ${{ matrix.platform }}
      target-arch: ${{ matrix.arch }}
      build-args: ${{ matrix.build-args }}
      channel: nightly
      version: ${{ needs.setup.outputs.version }}
      expected-legacy: true
      signing-required: false
      retention-days: 1
    secrets: inherit

  aggregate:
    needs: [setup, package]
    if: needs.setup.outputs.should_build == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-target-*
          path: staged
      - name: Merge macOS Nightly update metadata
        shell: bash
        run: >-
          bun apps/desktop/scripts/desktop-packaging/publishers/merge-electron-update-metadata.mjs
          staged/desktop-target-macos-arm64/nightly-mac.yml
          staged/desktop-target-macos-x64/nightly-mac.yml
          staged/nightly-mac.yml
      - name: Validate aggregate release evidence
        run: >-
          bun apps/desktop/scripts/desktop-packaging/package-validation/terminal-release-evidence.mjs aggregate
          --input-dir staged
          --output staged/terminal-release-manifest.json
          --channel nightly
      - name: Upload staged Nightly files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find staged -type f ! -name terminal-target-manifest.json ! -path '*/desktop-target-macos-*/nightly-mac.yml' | sort)
          test "${#files[@]}" -gt 0
          gh release upload "$TAG" "${files[@]}" --clobber --repo "${{ github.repository }}"
      - name: Publish complete Nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          for required in nightly.yml nightly-linux.yml nightly-mac.yml terminal-release-manifest.json; do
            grep -Fxq "$required" <<< "$assets"
          done
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --prerelease --latest=false
