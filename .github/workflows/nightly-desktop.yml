# Builds each target once, validates one aggregate evidence manifest, and then
# publishes the exact staged files to the per-build Nightly release.
name: Nightly Desktop

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-release-mutations
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  setup:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
      - id: check
        name: Compare HEAD to last complete Nightly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          last_tag=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,isDraft,isPrerelease --jq '[.[] | select(.isDraft == false and .isPrerelease == true and (.tagName | test("^v.*-nightly\\.")))][0].tagName // ""')
          if [ -z "$last_tag" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_sha=$(git rev-parse "${last_tag}^{commit}")
          head_sha=$(git rev-parse HEAD)
          if [ "$last_sha" != "$head_sha" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          assets=$(gh release view "$last_tag" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          for required in nightly.yml nightly-linux.yml nightly-mac.yml terminal-release-manifest.json; do
            if ! grep -Fxq "$required" <<< "$assets"; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "should_build=false" >> "$GITHUB_OUTPUT"
      - name: Compute Nightly version and tag
        if: steps.check.outputs.should_build == 'true'
        id: tag
        shell: bash
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version=$(bun -e '
            const fs = require("fs");
            const { computeNightlyVersion } = await import("./apps/desktop/scripts/compute-nightly-version.mjs");
            process.stdout.write(computeNightlyVersion({
              manifest: JSON.parse(fs.readFileSync(".release-please-manifest.json", "utf8")),
              runNumber: Number(process.env.GITHUB_RUN_NUMBER),
              date: new Date(),
            }));
          ')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Generate bot token
        if: steps.check.outputs.should_build == 'true'
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Create draft Nightly release
        if: steps.check.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$TAG" --draft --prerelease --latest=false \
            --title "Mcode Nightly ${{ steps.tag.outputs.version }} ($(git rev-parse --short HEAD))" \
            --notes "Automated Nightly build from ${{ github.sha }}." \
            --target "${{ github.sha }}" --repo "${{ github.repository }}"

  build:
    needs: setup
    if: needs.setup.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-2vcpu-windows-2025
            platform: windows
            arch: x64
            build_args: ""
          - runner: blacksmith-2vcpu-ubuntu-2404
            platform: linux
            arch: x64
            build_args: ""
          - runner: blacksmith-6vcpu-macos-26
            platform: macos
            arch: arm64
            build_args: --mac --arm64
          - runner: blacksmith-6vcpu-macos-26
            platform: macos
            arch: x64
            build_args: --mac --x64
    uses: ./.github/workflows/desktop-package-target.yml
    with:
      runner: ${{ matrix.runner }}
      target-platform: ${{ matrix.platform }}
      target-arch: ${{ matrix.arch }}
      build-args: ${{ matrix.build_args }}
      channel: nightly
      version: ${{ needs.setup.outputs.version }}
      expected-legacy: true
      signing-required: false
      retention-days: 90
    secrets: inherit

  publish:
    needs: [setup, build]
    if: needs.setup.outputs.should_build == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-target-*
          path: staged
      - name: Merge macOS Nightly update metadata
        shell: bash
        run: |
          bun apps/desktop/scripts/merge-electron-update-metadata.mjs \
            staged/desktop-target-macos-arm64/nightly-mac.yml \
            staged/desktop-target-macos-x64/nightly-mac.yml \
            staged/nightly-mac.yml
      - name: Validate aggregate release evidence
        run: >-
          bun apps/desktop/scripts/terminal-release-evidence.mjs aggregate
          --input-dir staged
          --output staged/terminal-release-manifest.json
          --channel nightly
      - name: Upload exact staged files and publish Nightly
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          for required in \
            staged/desktop-target-windows-x64/nightly.yml \
            staged/desktop-target-linux-x64/nightly-linux.yml \
            staged/nightly-mac.yml \
            staged/terminal-release-manifest.json; do
            test -f "$required"
          done
          mapfile -t files < <(find staged -type f \
            ! -name 'terminal-target-manifest.json' \
            ! -path '*/desktop-target-macos-*/nightly-mac.yml' | sort)
          gh release upload "$TAG" "${files[@]}" --clobber --repo "${{ github.repository }}"
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --prerelease --latest=false
