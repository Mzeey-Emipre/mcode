name: Release Please

on:
  push:
    branches: [main]
    paths:
      - ".release-please-manifest.json"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly-release-mutations
  cancel-in-progress: false
  queue: max

jobs:
  release-please:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10

    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.bot-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-stable-release:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    uses: ./.github/workflows/build-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      version: ${{ needs.release-please.outputs.version }}
    secrets: inherit

  cleanup-superseded-nightlies:
    needs: [release-please, build-stable-release]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Generate cleanup token
        id: cleanup-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Delete superseded nightly releases
        env:
          GH_TOKEN: ${{ steps.cleanup-token.outputs.token }}
          STABLE_TAG: ${{ needs.release-please.outputs.tag_name }}
          STABLE_VERSION: ${{ needs.release-please.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$STABLE_TAG" != "mcode-v${STABLE_VERSION}" ]]; then
            echo "Release Please outputs do not identify the same stable release."
            exit 1
          fi
          bun scripts/agent/cleanup-superseded-nightlies.mjs \
            --repo "${{ github.repository }}" \
            --stable-tag "$STABLE_TAG" \
            --apply
