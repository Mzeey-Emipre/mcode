name: Build Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      LINUX_RELEASE_GPG_PRIVATE_KEY:
        required: false
      LINUX_RELEASE_GPG_KEY_ID:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        required: true
        type: string
      version:
        description: Desktop package version
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-2vcpu-windows-2025
            platform: windows
            arch: x64
            build_args: ""
          - runner: blacksmith-2vcpu-ubuntu-2404
            platform: linux
            arch: x64
            build_args: ""
          - runner: blacksmith-6vcpu-macos-26
            platform: macos
            arch: arm64
            build_args: --mac --arm64
          - runner: blacksmith-6vcpu-macos-26
            platform: macos
            arch: x64
            build_args: --mac --x64
    uses: ./.github/workflows/desktop-package-target.yml
    with:
      runner: ${{ matrix.runner }}
      target-platform: ${{ matrix.platform }}
      target-arch: ${{ matrix.arch }}
      build-args: ${{ matrix.build_args }}
      channel: stable
      version: ${{ inputs.version }}
      expected-legacy: true
      signing-required: true
      retention-days: 90
    secrets: inherit

  publish:
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-target-*
          path: staged
      - name: Merge macOS Stable update metadata
        shell: bash
        run: |
          bun apps/desktop/scripts/desktop-packaging/publishers/merge-electron-update-metadata.mjs \
            staged/desktop-target-macos-arm64/latest-mac.yml \
            staged/desktop-target-macos-x64/latest-mac.yml \
            staged/latest-mac.yml
      - name: Validate aggregate release evidence
        run: >-
          bun apps/desktop/scripts/desktop-packaging/package-validation/terminal-release-evidence.mjs aggregate
          --input-dir staged
          --output staged/terminal-release-manifest.json
          --channel stable
      - name: Upload exact staged files and publish Stable
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          for required in \
            staged/desktop-target-windows-x64/latest.yml \
            staged/desktop-target-linux-x64/latest-linux.yml \
            staged/latest-mac.yml \
            staged/terminal-release-manifest.json; do
            test -f "$required"
          done
          release_state=$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft')
          test "$release_state" = "true"
          mapfile -t files < <(find staged -type f \
            ! -name 'terminal-target-manifest.json' \
            ! -path '*/desktop-target-macos-*/latest-mac.yml' | sort)
          gh release upload "$TAG" "${files[@]}" --clobber --repo "${{ github.repository }}"
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest
