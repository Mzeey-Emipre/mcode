name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR Title
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck:
    name: Typecheck
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      # Typecheck reads Electron's bundled types, not its binary; skip the binary
      # download and better-sqlite3 Electron prebuild so bun install does not flake
      # on 504s.
      SKIP_ELECTRON_REBUILD: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      # Lint runs ESLint under Node, not Electron; skip the binary download and
      # better-sqlite3 Electron prebuild so bun install does not flake on 504s.
      SKIP_ELECTRON_REBUILD: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"
      - run: bun install --frozen-lockfile
      - run: bun run lint

  test:
    name: Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      # Unit tests run under Node/vitest with Electron fully mocked; skip the
      # binary download and better-sqlite3 Electron prebuild so bun install does
      # not flake on 504s.
      SKIP_ELECTRON_REBUILD: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"
      - run: bun install --frozen-lockfile
      - run: bun run test

  build-check:
    name: Build Check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/web build
      - run: bun run --cwd apps/desktop build

      - name: Generate V8 snapshot
        run: bun apps/desktop/scripts/generate-snapshot.mjs

      - name: Smoke test server bundle
        run: node apps/desktop/scripts/smoke-test.mjs --bundle
