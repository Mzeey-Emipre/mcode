name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"

jobs:
  pr-title:
    name: PR Title
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck:
    name: Typecheck
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Typecheck reads Electron's bundled types, not its binary; skip the binary
      # download and better-sqlite3 Electron prebuild so bun install does not flake
      # on 504s.
      SKIP_ELECTRON_REBUILD: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure node-gyp headers
        shell: bash
        run: |
          node_dir="$(dirname "$(dirname "$(command -v node)")")"
          test -f "$node_dir/include/node/common.gypi"
          echo "npm_config_nodedir=$node_dir" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun install cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-
      - name: Cache Turbo outputs
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-typecheck-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-typecheck-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: Lint
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Lint runs ESLint under Node, not Electron; skip the binary download and
      # better-sqlite3 Electron prebuild so bun install does not flake on 504s.
      SKIP_ELECTRON_REBUILD: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure node-gyp headers
        shell: bash
        run: |
          node_dir="$(dirname "$(dirname "$(command -v node)")")"
          test -f "$node_dir/include/node/common.gypi"
          echo "npm_config_nodedir=$node_dir" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun install cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-
      - name: Cache Turbo outputs
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-lint-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-lint-
      - name: Cache ESLint results
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: apps/web/node_modules/.cache/.eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('bun.lock', 'apps/web/eslint.config.*', 'apps/web/src/**/*.{ts,tsx,js,jsx}') }}
          restore-keys: |
            ${{ runner.os }}-eslint-
      - run: bun install --frozen-lockfile
      - run: bun run lint:fast
      - run: bun run lint
        env:
          DEBUG: eslint:lint-result-cache

  test:
    name: Test
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Server tests launch Electron to load its runtime and native SQLite binding.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure node-gyp headers
        shell: bash
        run: |
          node_dir="$(dirname "$(dirname "$(command -v node)")")"
          test -f "$node_dir/include/node/common.gypi"
          echo "npm_config_nodedir=$node_dir" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun install cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-
      - name: Cache Turbo outputs
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-
      - run: bun install --frozen-lockfile
      - run: bun run test

  build-check:
    name: Build Check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure node-gyp headers
        shell: bash
        run: |
          node_dir="$(dirname "$(dirname "$(command -v node)")")"
          test -f "$node_dir/include/node/common.gypi"
          echo "npm_config_nodedir=$node_dir" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun install cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-runtime-${{ hashFiles('package.json') }}-lock-
      - name: Cache Turbo outputs
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-
      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Generate V8 snapshot
        run: bun apps/desktop/scripts/desktop-packaging/target-package/generate-snapshot.mjs

      - name: Smoke test server bundle
        run: bun apps/desktop/scripts/desktop-packaging/package-validation/smoke-test.mjs --bundle
