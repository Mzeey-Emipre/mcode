name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"

jobs:
  pr-title:
    name: PR Title
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck:
    name: Typecheck
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Typecheck reads Electron's bundled types, not its binary; skip the binary
      # download and better-sqlite3 Electron prebuild so bun install does not flake
      # on 504s.
      SKIP_ELECTRON_REBUILD: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - name: Configure node-gyp headers
        shell: bash
        run: |
          node_dir="$(dirname "$(dirname "$(command -v node)")")"
          test -f "$node_dir/include/node/common.gypi"
          echo "npm_config_nodedir=$node_dir" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun install cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Cache Turbo outputs
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-typecheck-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-typecheck-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: Lint
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Lint runs ESLint under Node, not Electron; skip the binary download and
      # better-sqlite3 Electron prebuild so bun install does not flake on 504s.
      SKIP_ELECTRON_REBUILD: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - name: Configure node-gyp headers
        shell: bash
        run: |
          node_dir="$(dirname "$(dirname "$(command -v node)")")"
          test -f "$node_dir/include/node/common.gypi"
          echo "npm_config_nodedir=$node_dir" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun install cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Cache Turbo outputs
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-lint-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-lint-
      - name: Cache ESLint results
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: apps/web/node_modules/.cache/.eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('bun.lock', 'apps/web/eslint.config.*', 'apps/web/src/**/*.{ts,tsx,js,jsx}') }}
          restore-keys: |
            ${{ runner.os }}-eslint-
      - run: bun install --frozen-lockfile
      - run: bun run lint
        env:
          DEBUG: eslint:lint-result-cache

  test:
    name: Test
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Unit tests run under Node/vitest with Electron fully mocked; skip the
      # binary download and better-sqlite3 Electron prebuild so bun install does
      # not flake on 504s.
      SKIP_ELECTRON_REBUILD: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - name: Configure node-gyp headers
        shell: bash
        run: |
          node_dir="$(dirname "$(dirname "$(command -v node)")")"
          test -f "$node_dir/include/node/common.gypi"
          echo "npm_config_nodedir=$node_dir" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun install cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Cache Turbo outputs
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-
      - run: bun install --frozen-lockfile
      - run: bun run test

  test-web-e2e:
    name: Test Web E2E (shard ${{ matrix.shard }}/4)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    # GitHub Actions sets CI=true, so playwright.config.ts switches to
    # single-worker mode with retries automatically (no env wiring needed).
    # The suite mocks the WebSocket transport, so no backend server is required;
    # Playwright boots its own Vite dev server via the config's webServer block.
    # Sharded across runners to keep wall-clock low while preserving the config's
    # single-worker-per-process reproducibility (no in-machine contention).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # The web e2e suite never launches Electron; skip the binary download and
      # better-sqlite3 Electron prebuild so bun install does not flake on 504s.
      SKIP_ELECTRON_REBUILD: "1"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - name: Configure node-gyp headers
        shell: bash
        run: |
          node_dir="$(dirname "$(dirname "$(command -v node)")")"
          test -f "$node_dir/include/node/common.gypi"
          echo "npm_config_nodedir=$node_dir" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun install cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile

      # Read the resolved version straight from the lockfile (the source of truth
      # for --frozen-lockfile) rather than `playwright --version`, which can
      # re-resolve within the semver range and key the cache on a version CI
      # never installs.
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'const s=require("fs").readFileSync("bun.lock","utf8");const m=s.match(/"@playwright\/test@([0-9][^"]+)"/);if(!m){console.error("playwright not found in bun.lock");process.exit(1)}console.log(m[1])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved Playwright version: $version"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium (with system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      # System libraries live outside the cached browser directory, so a warm
      # cache still needs them installed before Chromium can launch.
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: apps/web
        run: bunx playwright install-deps chromium

      - name: Run web e2e suite (shard ${{ matrix.shard }}/4)
        working-directory: apps/web
        run: bunx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  build-check:
    name: Build Check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - name: Configure node-gyp headers
        shell: bash
        run: |
          node_dir="$(dirname "$(dirname "$(command -v node)")")"
          test -f "$node_dir/include/node/common.gypi"
          echo "npm_config_nodedir=$node_dir" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - name: Cache Bun install cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Cache Turbo outputs
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-
      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Generate V8 snapshot
        run: bun apps/desktop/scripts/generate-snapshot.mjs

      - name: Smoke test server bundle
        run: node apps/desktop/scripts/smoke-test.mjs --bundle
