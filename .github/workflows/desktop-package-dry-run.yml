name: Desktop Package Dry Run

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/desktop-package-dry-run.yml"
      - ".github/workflows/desktop-package-target.yml"
      - "apps/desktop/package.json"
      - "apps/desktop/tsconfig.json"
      - "apps/desktop/src/main/**"
      - "apps/desktop/src/features/preview/preload/**"
      - "apps/desktop/src/features/server-runtime/process/**"
      - "apps/desktop/scripts/build-main.mjs"
      - "apps/desktop/scripts/desktop-packaging/**"
      - "apps/desktop/build/**"
      - "apps/server/package.json"
      - "apps/server/.swcrc"
      - "apps/server/src/index.ts"
      - "apps/server/src/application/bootstrap/**"
      - "apps/server/src/runtime/persistence/sqlite/database.ts"
      - "apps/server/src/runtime/process/orphan-cleanup.ts"
      - "apps/server/src/runtime/process/containment/**"
      - "apps/server/src/features/terminal/host/**"
      - "apps/server/drizzle/**"
      - "apps/web/package.json"
      - "apps/web/vite.config.ts"
      - "packages/*/package.json"
      - "scripts/build-server-dev-bundle.mjs"
      - "scripts/postinstall.mjs"
      - "scripts/electron-postinstall.mjs"
      - "scripts/ensure-electron.mjs"
      - "scripts/node-runtime.mjs"
      - ".node-version"
      - "package.json"
      - "bun.lock"
      - "CHANGELOG.md"
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - "!**/__tests__/**"
      - "!**/*.test.*"
      - "!**/*.spec.*"
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Package all four desktop targets (default is Linux x64 canary only)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-canary:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.full_matrix != true) ||
      (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - target-id: linux-x64
            runner: blacksmith-2vcpu-ubuntu-2404
            platform: linux
            arch: x64
            build-args: --config.deb.compression=gz
    uses: ./.github/workflows/desktop-package-target.yml
    with:
      runner: ${{ matrix.runner }}
      target-platform: ${{ matrix.platform }}
      target-arch: ${{ matrix.arch }}
      build-args: ${{ matrix.build-args }}
      channel: pull-request
      expected-legacy: true
      signing-required: false
      retention-days: 1

  package-full:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.full_matrix == true) ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - target-id: windows-x64
            runner: blacksmith-2vcpu-windows-2025
            platform: windows
            arch: x64
            build-args: --config.compression=store
          - target-id: linux-x64
            runner: blacksmith-2vcpu-ubuntu-2404
            platform: linux
            arch: x64
            build-args: --config.deb.compression=gz
          - target-id: macos-arm64
            runner: blacksmith-6vcpu-macos-26
            platform: macos
            arch: arm64
            build-args: --mac --arm64
          - target-id: macos-x64
            runner: blacksmith-6vcpu-macos-26
            platform: macos
            arch: x64
            build-args: --mac --x64
    uses: ./.github/workflows/desktop-package-target.yml
    with:
      runner: ${{ matrix.runner }}
      target-platform: ${{ matrix.platform }}
      target-arch: ${{ matrix.arch }}
      build-args: ${{ matrix.build-args }}
      channel: pull-request
      expected-legacy: true
      signing-required: false
      retention-days: 1

  verify-release-evidence:
    needs: package-full
    if: needs.package-full.result == 'success'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-target-*
          path: staged
      - name: Verify aggregate release evidence
        run: >-
          bun apps/desktop/scripts/desktop-packaging/package-validation/terminal-release-evidence.mjs aggregate
          --input-dir staged
          --channel pull-request
