name: Desktop Package Dry Run

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/desktop-package-target.yml"
      - ".github/workflows/desktop-package-dry-run.yml"
      - ".github/workflows/nightly-desktop.yml"
      - ".github/workflows/build-release.yml"
      - "apps/desktop/**"
      - "apps/web/package.json"
      - "packages/contracts/src/models/terminal-diagnostics.ts"
      - "scripts/build-server-dev-bundle.mjs"
      - "package.json"
      - "bun.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-linux-desktop:
    uses: ./.github/workflows/desktop-package-target.yml
    with:
      runner: blacksmith-2vcpu-ubuntu-2404
      target-platform: linux
      target-arch: x64
      build-args: --linux dir AppImage deb
      channel: pull-request
      expected-legacy: true
      signing-required: false
      retention-days: 1

  verify-release-evidence:
    needs: package-linux-desktop
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: desktop-target-linux-x64
          path: staged/linux-x64
      - name: Verify aggregate release evidence
        run: >-
          bun apps/desktop/scripts/terminal-release-evidence.mjs aggregate
          --input-dir staged
          --channel pull-request
