<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worktree deletion lifecycle</title>
  <script>
    (() => {
      const savedTheme = localStorage.getItem("mcode-worktree-diagram-theme");
      const isDark = savedTheme ? savedTheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", isDark);
    })();
  </script>
  <style>
    :root {
      --bg: #faf9f5; --surface: #ffffff; --surface-alt: #f0eee6;
      --ink: #141413; --body: #3d3d3a; --muted: #787770;
      --line: #d1cfc5; --line-soft: #e6e3da;
      --accent: #c56548; --accent-soft: rgba(197, 101, 72, 0.12);
      --success: #617c4b; --success-soft: rgba(97, 124, 75, 0.13);
      --warning: #a6752b; --warning-soft: rgba(166, 117, 43, 0.13);
      --danger: #b04a3f; --danger-soft: rgba(176, 74, 63, 0.11);
      --zone: rgba(20, 20, 19, 0.025);
      --serif: ui-serif, Georgia, "Times New Roman", serif;
      --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
    }

    html.dark {
      --bg: #141413; --surface: #1f1f1d; --surface-alt: #2a2a28;
      --ink: #faf9f5; --body: #d1cfc5; --muted: #aaa9a1;
      --line: #454440; --line-soft: #2a2a28;
      --accent: #e38b6e; --accent-soft: rgba(227, 139, 110, 0.16);
      --success: #9aae7c; --success-soft: rgba(154, 174, 124, 0.16);
      --warning: #d4b36f; --warning-soft: rgba(212, 179, 111, 0.15);
      --danger: #de8275; --danger-soft: rgba(222, 130, 117, 0.16);
      --zone: rgba(250, 249, 245, 0.035);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--body); display: flex;
      flex-direction: column; font-family: var(--sans); overflow: hidden;
    }

    .bar {
      align-items: center; border-bottom: 1px solid var(--line-soft);
      display: flex; gap: 1rem; padding: 0.75rem 1.25rem;
    }
    .title { min-width: 15rem; }
    h1 {
      color: var(--ink); font-family: var(--serif); font-size: 1.25rem;
      font-weight: 500; letter-spacing: -0.02em; margin: 0;
    }
    .subtitle {
      color: var(--muted); font-family: var(--mono); font-size: 0.67rem;
      letter-spacing: 0.07em; margin-top: 0.22rem; text-transform: uppercase;
    }
    .spacer { flex: 1; }
    .flows { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    button {
      background: transparent; border: 1px solid var(--line); border-radius: 0.4rem;
      color: var(--muted); cursor: pointer; font-family: var(--mono); font-size: 0.67rem;
      letter-spacing: 0.03em; padding: 0.35rem 0.55rem;
    }
    button:hover, button:focus-visible { border-color: var(--muted); color: var(--ink); }
    .flow-button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

    .stage { flex: 1; min-height: 0; position: relative; }
    .stage svg { display: block; height: 100%; width: 100%; }

    .zone rect { fill: var(--zone); rx: 16; stroke: var(--line); stroke-dasharray: 5 5; }
    .zone text { fill: var(--muted); font-family: var(--mono); font-size: 12px; letter-spacing: 0.11em; }

    .edge {
      fill: none; marker-end: url(#arrow-muted); stroke: var(--muted);
      stroke-width: 1.8; transition: opacity 160ms ease, stroke 160ms ease;
    }
    .edge.dashed { stroke-dasharray: 6 5; }
    .edge.warning { marker-end: url(#arrow-warning); stroke: var(--warning); }
    .edge.danger { marker-end: url(#arrow-danger); stroke: var(--danger); }
    .edge-label { fill: var(--muted); font-family: var(--mono); font-size: 11px; }

    .node { cursor: pointer; outline: none; }
    .node rect, .node path {
      fill: var(--surface); stroke: var(--line); stroke-width: 1.6;
      transition: fill 160ms ease, stroke 160ms ease, stroke-width 160ms ease;
    }
    .node .node-title {
      fill: var(--ink); font-family: var(--sans); font-size: 15px;
      font-weight: 600; pointer-events: none;
    }
    .node .node-meta { fill: var(--muted); font-family: var(--mono); font-size: 11px; pointer-events: none; }
    .node.gate path { fill: var(--accent-soft); stroke: var(--accent); }
    .node.queue rect { fill: var(--accent-soft); stroke: var(--accent); }
    .node.worker rect { fill: var(--surface-alt); }
    .node.success rect { fill: var(--success-soft); stroke: var(--success); }
    .node.keep rect { fill: var(--warning-soft); stroke: var(--warning); }
    .node.failure rect { fill: var(--danger-soft); stroke: var(--danger); }
    .node:hover rect, .node:hover path, .node.selected rect, .node.selected path {
      stroke: var(--accent); stroke-width: 2.4;
    }
    .node:focus-visible rect, .node:focus-visible path { stroke: var(--accent); stroke-width: 2.4; }

    .stage.flowing .edge, .stage.flowing .edge-label, .stage.flowing .node, .stage.flowing .zone { opacity: 0.16; }
    .stage.flowing .edge.lit {
      marker-end: url(#arrow-accent); opacity: 1; stroke: var(--accent);
      stroke-dasharray: 8 6; animation: flow 0.8s linear infinite;
    }
    .stage.flowing .edge.lit.warning { marker-end: url(#arrow-warning); stroke: var(--warning); }
    .stage.flowing .edge.lit.danger { marker-end: url(#arrow-danger); stroke: var(--danger); }
    .stage.flowing .edge-label.lit { fill: var(--accent); opacity: 1; }
    .stage.flowing .node.lit, .stage.flowing .zone.lit { opacity: 1; }
    .stage.flowing .node.lit rect, .stage.flowing .node.lit path { stroke: var(--accent); }
    .stage.flowing .node.lit.keep rect { stroke: var(--warning); }
    .stage.flowing .node.lit.failure rect { stroke: var(--danger); }
    @keyframes flow { to { stroke-dashoffset: -14; } }
    @media (prefers-reduced-motion: reduce) { .stage.flowing .edge.lit { animation: none; } }

    .detail, .flow-caption {
      background: var(--surface); border: 1px solid var(--line); border-radius: 0.7rem;
      box-shadow: 0 0.4rem 1.5rem rgba(0, 0, 0, 0.08); padding: 0.85rem 1rem;
      position: absolute;
    }
    .detail { bottom: 1rem; right: 1rem; width: min(22rem, calc(100% - 2rem)); }
    .flow-caption { bottom: 1rem; display: none; left: 1rem; max-width: 27rem; }
    .flow-caption.show { display: block; }
    .caption-name, .detail-meta {
      color: var(--accent); font-family: var(--mono); font-size: 0.67rem;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .detail h2 {
      color: var(--ink); font-family: var(--serif); font-size: 1.15rem;
      font-weight: 500; margin: 0.2rem 0;
    }
    .detail p, .flow-caption p { color: var(--body); font-size: 0.78rem; line-height: 1.55; margin: 0.55rem 0 0; }

    @media (max-width: 960px) {
      body { overflow: auto; }
      .bar { align-items: flex-start; flex-wrap: wrap; }
      .stage { min-height: 42rem; padding-bottom: 0.75rem; }
      .detail, .flow-caption { margin: 0.75rem 1rem 0; position: static; width: auto; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <div class="title">
      <h1>Worktree deletion</h1>
      <div class="subtitle">Sandbox policy and cleanup execution</div>
    </div>
    <div class="spacer"></div>
    <nav class="flows" aria-label="Deletion paths">
      <button class="flow-button" data-flow="all" aria-pressed="true">Everything</button>
      <button class="flow-button" data-flow="success" aria-pressed="false">Sandbox deletion</button>
      <button class="flow-button" data-flow="preserve" aria-pressed="false">Protected checkout</button>
      <button class="flow-button" data-flow="failure" aria-pressed="false">Operational failure</button>
      <button class="flow-button" data-flow="branch" aria-pressed="false">Force branch removal</button>
    </nav>
    <button id="theme-toggle" type="button" aria-label="Toggle color theme">Theme</button>
  </header>

  <main class="stage" id="stage">
    <svg viewBox="0 0 1600 900" role="img" aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Mcode worktree deletion lifecycle</title>
      <desc id="svg-desc">Mcode removes every thread linked to a canonical sandbox worktree. It keeps only an external checkout or a checkout on the repository default branch. Filesystem failures retry separately.</desc>
      <defs>
        <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="marker-muted" d="M0,0 L10,5 L0,10 z" /></marker>
        <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="marker-accent" d="M0,0 L10,5 L0,10 z" /></marker>
        <marker id="arrow-warning" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="marker-warning" d="M0,0 L10,5 L0,10 z" /></marker>
        <marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="marker-danger" d="M0,0 L10,5 L0,10 z" /></marker>
        <style>
          .marker-muted { fill: var(--muted); }
          .marker-accent { fill: var(--accent); }
          .marker-warning { fill: var(--warning); }
          .marker-danger { fill: var(--danger); }
        </style>
      </defs>

      <g class="zone" data-zone="ui"><rect x="40" y="110" width="250" height="600" /><text x="62" y="142">SIDEBAR</text></g>
      <g class="zone" data-zone="server"><rect x="325" y="110" width="410" height="600" /><text x="347" y="142">THREAD CLEANUP POLICY</text></g>
      <g class="zone" data-zone="queue"><rect x="770" y="110" width="300" height="600" /><text x="792" y="142">CLEANUP QUEUE</text></g>
      <g class="zone" data-zone="filesystem"><rect x="1105" y="110" width="455" height="600" /><text x="1127" y="142">GIT AND FILESYSTEM</text></g>

      <path class="edge" id="e-request" d="M270,330 C305,330 315,330 350,330" />
      <path class="edge" id="e-teardown" d="M510,385 L510,450" />
      <path class="edge" id="e-gate" d="M650,495 L690,495" />
      <path class="edge warning" id="e-preserve" d="M640,540 C640,620 560,620 510,620" />
      <path class="edge" id="e-queue" d="M765,495 L805,495" />
      <path class="edge" id="e-worker" d="M995,450 C1090,395 1125,325 1165,325" />
      <path class="edge" id="e-remove" d="M1305,380 L1305,450" />
      <path class="edge" id="e-success" d="M1305,535 L1305,605" />
      <path class="edge danger" id="e-failure" d="M1225,535 C1135,585 1055,625 1005,625" />
      <path class="edge danger dashed" id="e-exhausted" d="M905,680 L905,730" />
      <path class="edge warning dashed" id="e-branch" d="M1385,495 C1450,495 1465,450 1470,415" />

      <text class="edge-label" data-edge="e-preserve" x="568" y="576">no: external or default branch</text>
      <text class="edge-label" data-edge="e-queue" x="775" y="480">yes: sandbox feature branch</text>
      <text class="edge-label" data-edge="e-failure" x="1070" y="590">operating-system failure</text>
      <text class="edge-label" data-edge="e-branch" x="1450" y="470">force delete</text>

      <g class="node" data-node="request" role="button" tabindex="0" aria-label="Delete worktree request">
        <rect x="70" y="285" width="200" height="90" rx="12" />
        <text class="node-title" x="92" y="319">Delete thread</text>
        <text class="node-meta" x="92" y="344">toggle: delete worktree</text>
        <text class="node-meta" x="92" y="361">thread.delete(...)</text>
      </g>

      <g class="node" data-node="teardown" role="button" tabindex="0" aria-label="Teardown active thread work">
        <rect x="350" y="285" width="320" height="100" rx="12" />
        <text class="node-title" x="374" y="319">Stop active thread work</text>
        <text class="node-meta" x="374" y="344">setup · project actions · CI · agent</text>
        <text class="node-meta" x="374" y="363">GitHub work · worktree watcher</text>
      </g>

      <g class="node gate" data-node="ownership" role="button" tabindex="0" aria-label="Mcode ownership decision">
        <path d="M690,430 L765,495 L690,560 L615,495 Z" />
        <text class="node-title" x="690" y="488" text-anchor="middle">canonical sandbox</text>
        <text class="node-meta" x="690" y="507" text-anchor="middle">and not default branch?</text>
      </g>

      <g class="node keep" data-node="preserve" role="button" tabindex="0" aria-label="Worktree intentionally preserved">
        <rect x="350" y="575" width="300" height="90" rx="12" />
        <text class="node-title" x="374" y="609">Keep worktree directory</text>
        <text class="node-meta" x="374" y="634">outside sandbox · default branch</text>
        <text class="node-meta" x="374" y="651">or cleanup not requested</text>
      </g>

      <g class="node queue" data-node="queue" role="button" tabindex="0" aria-label="Soft delete and queue cleanup">
        <rect x="805" y="430" width="190" height="130" rx="12" />
        <text class="node-title" x="829" y="466">Soft delete</text>
        <text class="node-meta" x="829" y="489">first sandbox-policy check</text>
        <text class="node-title" x="829" y="521">Insert job</text>
        <text class="node-meta" x="829" y="544">cleanup_jobs row</text>
      </g>

      <g class="node worker" data-node="worker" role="button" tabindex="0" aria-label="Cleanup worker runtime release">
        <rect x="1165" y="270" width="280" height="110" rx="12" />
        <text class="node-title" x="1189" y="306">Cleanup worker</text>
        <text class="node-meta" x="1189" y="331">repository lock · policy recheck</text>
        <text class="node-meta" x="1189" y="350">stop every linked thread first</text>
      </g>

      <g class="node" data-node="remove" role="button" tabindex="0" aria-label="Remove worktree on disk">
        <rect x="1165" y="450" width="280" height="85" rx="12" />
        <text class="node-title" x="1189" y="483">Remove checkout</text>
        <text class="node-meta" x="1189" y="507">git worktree remove --force --force</text>
        <text class="node-meta" x="1189" y="524">bounded fallback · git branch -D</text>
      </g>

      <g class="node success" data-node="complete" role="button" tabindex="0" aria-label="Sandbox deletion">
        <rect x="1165" y="605" width="280" height="85" rx="12" />
        <text class="node-title" x="1189" y="638">Cleanup complete</text>
        <text class="node-meta" x="1189" y="662">remove artifacts · hard delete all linked threads</text>
        <text class="node-meta" x="1189" y="679">delete every linked cleanup job</text>
      </g>

      <g class="node failure" data-node="retry" role="button" tabindex="0" aria-label="Cleanup retry">
        <rect x="805" y="580" width="200" height="100" rx="12" />
        <text class="node-title" x="829" y="614">Removal failed</text>
        <text class="node-meta" x="829" y="639">retry after 2, 4, 8,</text>
        <text class="node-meta" x="829" y="656">16, then 32 seconds</text>
      </g>

      <g class="node failure" data-node="gap" role="button" tabindex="0" aria-label="Explicit cleanup failure gap">
        <rect x="760" y="730" width="290" height="105" rx="12" />
        <text class="node-title" x="784" y="764">Operating-system failure</text>
        <text class="node-meta" x="784" y="789">an operation can still fail after policy allows it</text>
        <text class="node-meta" x="784" y="807">the worker retries its persisted job</text>
        <text class="node-meta" x="784" y="824">this is not a cleanup-policy exception</text>
      </g>

      <g class="node keep" data-node="branch" role="button" tabindex="0" aria-label="Branch may remain">
        <rect x="1455" y="330" width="95" height="85" rx="12" />
        <text class="node-title" x="1502" y="360" text-anchor="middle">Branch</text>
        <text class="node-meta" x="1502" y="381" text-anchor="middle">git -D</text>
        <text class="node-meta" x="1502" y="398" text-anchor="middle">unless checked out elsewhere</text>
      </g>
    </svg>

    <aside class="flow-caption" id="flow-caption" aria-live="polite">
      <div class="caption-name" id="caption-name"></div>
      <p id="caption-body"></p>
    </aside>

    <aside class="detail" aria-live="polite">
      <div class="detail-meta" id="detail-meta">SELECT A NODE</div>
      <h2 id="detail-title">What the policy confirms</h2>
      <p id="detail-body">A sandbox worktree on a non-default branch removes every linked thread. An external or default-branch checkout keeps its directory.</p>
    </aside>
  </main>

  <script>
    const details = {
      request: ["client request", "Delete worktree is a boolean on the thread delete RPC. When selected, a canonical sandbox checkout enters the shared cleanup path."],
      teardown: ["teardown", "Mcode stops setup, project actions, CI, GitHub work, the agent runtime, and the worktree watcher before it deletes a linked thread."],
      ownership: ["sandbox policy", "The policy resolves the canonical path under Mcode storage and reads the repository default branch. Dirtiness, commits, and sibling threads do not change the result."],
      preserve: ["protected checkout", "The checkout stays only when cleanup is not requested, its canonical path is outside Mcode storage, or it is on the repository default branch."],
      queue: ["cleanup queued", "Mcode queues the cleanup job after the first sandbox-policy check. The worker checks the policy again while it holds the repository lock."],
      worker: ["cleanup worker", "The worker stops every thread linked to the canonical sandbox path. It then waits for process exit and releases Windows file handles before removal."],
      remove: ["filesystem removal", "Mcode first runs git worktree remove with force. If the directory remains, it uses a bounded removal fallback, prunes Git metadata, and force-deletes the branch."],
      complete: ["success", "After the directory is gone, Mcode removes artifacts, hard-deletes every linked thread record, and removes every linked cleanup job."],
      retry: ["operating-system retry", "A filesystem or Git failure stores its error and retries. This is an operating failure, not a reason to retain a sandbox checkout."],
      gap: ["remaining operating failure", "The policy no longer blocks for dirty files, unique commits, or sharing. A directory can remain only when a filesystem or Git operation fails."],
      branch: ["branch cleanup", "After worktree removal, Mcode runs git branch -D for a non-default sandbox branch. Git can still refuse when another checkout uses that branch."],
    };

    const flows = {
      success: {
        name: "Sandbox deletion",
        edges: ["e-request", "e-teardown", "e-gate", "e-queue", "e-worker", "e-remove", "e-success"],
        nodes: ["request", "teardown", "ownership", "queue", "worker", "remove", "complete"],
        zones: ["ui", "server", "queue", "filesystem"],
        text: "A canonical sandbox checkout on a non-default branch removes every linked thread after runtime teardown. Dirtiness, commits, and sharing do not block it."
      },
      preserve: {
        name: "Intentional preserve",
        edges: ["e-request", "e-teardown", "e-gate", "e-preserve"],
        nodes: ["request", "teardown", "ownership", "preserve"],
        zones: ["ui", "server"],
        text: "Mcode keeps an external checkout or a checkout on the repository default branch. It removes only the selected thread data."
      },
      failure: {
        name: "Operational failure",
        edges: ["e-request", "e-teardown", "e-gate", "e-queue", "e-worker", "e-remove", "e-failure", "e-exhausted"],
        nodes: ["request", "teardown", "ownership", "queue", "worker", "remove", "retry", "gap"],
        zones: ["ui", "server", "queue", "filesystem"],
        text: "This is not a policy branch. Mcode already decided that the sandbox checkout is removable, but the filesystem or Git command did not complete."
      },
      branch: {
        name: "Branch cleanup",
        edges: ["e-request", "e-teardown", "e-gate", "e-queue", "e-worker", "e-remove", "e-branch"],
        nodes: ["request", "teardown", "ownership", "queue", "worker", "remove", "branch"],
        zones: ["ui", "server", "queue", "filesystem"],
        text: "Mcode uses git branch -D after it removes a non-default sandbox checkout. Git retains the branch only when another worktree still checks it out."
      },
    };

    const stage = document.getElementById("stage");
    const flowButtons = document.querySelectorAll(".flow-button");
    const nodes = document.querySelectorAll(".node");
    const edges = document.querySelectorAll(".edge");
    const labels = document.querySelectorAll(".edge-label");
    const zones = document.querySelectorAll(".zone");
    const detailMeta = document.getElementById("detail-meta");
    const detailTitle = document.getElementById("detail-title");
    const detailBody = document.getElementById("detail-body");
    const flowCaption = document.getElementById("flow-caption");
    const captionName = document.getElementById("caption-name");
    const captionBody = document.getElementById("caption-body");

    function setFlow(name) {
      flowButtons.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.flow === name)));
      edges.forEach((edge) => edge.classList.remove("lit"));
      labels.forEach((label) => label.classList.remove("lit"));
      nodes.forEach((node) => node.classList.remove("lit"));
      zones.forEach((zone) => zone.classList.remove("lit"));
      if (name === "all") {
        stage.classList.remove("flowing");
        flowCaption.classList.remove("show");
        return;
      }
      const flow = flows[name];
      stage.classList.add("flowing");
      flow.edges.forEach((id) => document.getElementById(id)?.classList.add("lit"));
      labels.forEach((label) => { if (flow.edges.includes(label.dataset.edge)) label.classList.add("lit"); });
      flow.nodes.forEach((id) => document.querySelector(`.node[data-node="${id}"]`)?.classList.add("lit"));
      flow.zones.forEach((id) => document.querySelector(`.zone[data-zone="${id}"]`)?.classList.add("lit"));
      captionName.textContent = flow.name;
      captionBody.textContent = flow.text;
      flowCaption.classList.add("show");
    }

    function selectNode(node) {
      nodes.forEach((item) => item.classList.remove("selected"));
      node.classList.add("selected");
      const [meta, body] = details[node.dataset.node];
      detailMeta.textContent = meta;
      detailTitle.textContent = node.querySelector(".node-title")?.textContent.trim() ?? "Deletion step";
      detailBody.textContent = body;
    }

    flowButtons.forEach((button) => button.addEventListener("click", () => setFlow(button.dataset.flow)));
    nodes.forEach((node) => {
      node.addEventListener("click", () => selectNode(node));
      node.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          selectNode(node);
        }
      });
    });

    document.getElementById("theme-toggle").addEventListener("click", () => {
      const isDark = !document.documentElement.classList.contains("dark");
      document.documentElement.classList.toggle("dark", isDark);
      localStorage.setItem("mcode-worktree-diagram-theme", isDark ? "dark" : "light");
    });
  </script>
</body>
</html>
